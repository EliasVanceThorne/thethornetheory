        .chat-messages::-webkit-scrollbar-track, .users-list::-webkit-scrollbar-track { background: #000; }
        .chat-messages::-webkit-scrollbar-thumb, .users-list::-webkit-scrollbar-thumb { background: #CC99CC; border-radius: 4px; }

        /* PANNELLO UTENTI CONNESSI */
        .online-panel {
            flex-grow: 1;
            width: 220px;
            background-color: #0c0c12;
            border: 1px solid #333344;
            border-radius: 15px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .online-panel h3 {
            color: #CC99CC;
            margin: 0 0 15px 0;
            font-size: 1.2rem;
            border-bottom: 1px solid #333344;

        }

        .users-list {
            flex-grow: 1;

            display: flex;

        }

        .user-badge {
            background-color: #050508;
            border-left: 3px solid #00FFCC;

        }

        /* CHAT MESSAGE ITEM (RIMOSSO BOTTONE DELETE) */
        .msg-item {
            background-color: #050508;
            border-left: 5px solid #FF9900;
            padding: 10px 15px;
            border-radius: 0 8px 8px 0;
        }

        .msg-content { flex-grow: 1; }
        .msg-meta { 
            display: flex; 
            justify-content: space-between; 
            font-size: 0.95rem; 
            color: #FFCC33; 
            font-weight: bold; 
            margin-bottom: 4px; 
        }
        .msg-text { color: #DDDDDD; font-size: 1.1rem; text-transform: none; letter-spacing: 0.5px; }

        /* CHAT INPUT FORM */
        .chat-form { max-width: 1200px; }
        .form-row { display: flex; gap: 10px; }
        
        .chat-form input, .chat-form textarea {
            background-color: #111; border: 1px solid #444; color: #FF9900;
            font-family: 'Antonio', sans-serif; padding: 10px; font-size: 1.1rem; border-radius: 5px; box-sizing: border-box;
        }
        .chat-form .input-sender { width: 20%; text-transform: uppercase; }
        .chat-form .input-auth { width: 15%; text-transform: uppercase; }
        .chat-form .input-text { width: 50%; height: 42px; resize: none; text-transform: none; }
        .chat-form input:focus, .chat-form textarea:focus { outline: none; border-color: #CC99CC; }

        .btn-send {
            width: 15%; background-color: #CC99CC; color: black; border: none;
            font-family: 'Antonio', sans-serif; font-weight: bold; font-size: 1rem;
            padding: 0 10px; cursor: pointer; border-radius: 5px; transition: 0.2s; height: 42px; text-transform: uppercase;
        }
        .btn-send:hover { filter: brightness(1.2); background-color: #FFCC33; }

        .footer { margin-top: auto; color: #444; font-size: 0.9rem; background-color: black; padding-top: 10px; border-top: 1px solid #222; }
    </style>
</head>
<body>

<div class="lcars-left">

<div class="main-frame">
    <h1>SUBSPACE COMMS TERMINAL</h1>
    <div class="sub-title">CHANNEL // GLOBAL_COMMS_MATRIX // REALTIME LINK</div>

    <div class="comms-wrapper">
        <div class="chat-container">
            <div class="chat-messages" id="chatMatrix"></div>
        </div>

        <div class="online-panel">
            <h3>ONLINE OFFICERS</h3>
            <div class="users-list" id="usersList">
                </div>
        </div>
    </div>

    <form class="chat-form" onsubmit="transmitGlobalMessage(event, this)">
        <div class="form-row">
            <input type="text" placeholder="SENDER ID" required class="input-sender" id="senderId" onchange="updatePresence()">
            <input type="password" placeholder="AUTH CODE" required class="input-auth" id="authCode">
            <textarea placeholder="TYPE SUBSPACE TRANSMISSION..." required class="input-text" id="msgText" onkeydown="handleChatSubmit(event)"></textarea>
            <button type="submit" class="btn-send">TRANSMIT</button>
        </div>
    </form>

    <div class="footer">
        LCARS COMMS FREQUENCY ACTIVE | FREQ: 42.1 GHz | AUTOMATIC 24HR PURGE PROTOCOL ONLINE
    </div>
</div>

<script>
    const SUPABASE_URL = "https://dvjtdszdzcdatqextzrz.supabase.co";
    const SUPABASE_KEY = "sb_publishable_y2ndok49LIbaDl7C89aiGg_lABxwt_u";
    
    const ADMIN_SENDER = "ADMIN";
    const ADMIN_KEY = "SIGMA-THETA-9-7-ALPHA"; 
    const GLOBAL_POST_ID = "GLOBAL_COMMS";

    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    let presenceChannel = null;

    function convertTNG(day, month, year, hour, minute) {
        const futureYear = year + 386;
        const date = new Date(futureYear, month - 1, day, hour, minute);
        const utcMs = date.getTime();
        const tngEpoch = new Date(2364, 0, 1).getTime();
        const days = (utcMs - tngEpoch) / 86400000;
        const sd = (days / 365.2422) * 1000;
        return sd.toFixed(1);
    }

    function getFutureStardate() {
        const now = new Date();
        return convertTNG(now.getDate(), now.getMonth() + 1, now.getFullYear(), now.getHours(), now.getMinutes());
    }

    function handleChatSubmit(event) {
        if (event.key === 'Enter' && !event.shiftKey) {
            event.preventDefault();
            const form = event.target.closest('form');
            if (form) form.requestSubmit();
        }
    }

    window.addEventListener('DOMContentLoaded', () => {
        loadGlobalChat();
        
        // 1. Canale Realtime per i messaggi della chat
        supabaseClient
            .channel('public:transmissions')
            .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'transmissions' }, payload => {
                if (payload.new.post_id === GLOBAL_POST_ID) {
                    appendMessage(payload.new);
                }
            })
            .on('postgres_changes', { event: 'DELETE', schema: 'public', table: 'transmissions' }, () => {
                loadGlobalChat(); // Se il trigger elimina roba vecchia di 24h, aggiorna la vista
            })
            .subscribe();

        // 2. Inizializza il canale di presenza globale
        setupPresence();
    });

    // --- TRACKING PRESENZA UTENTI ONLINE ---
    function setupPresence() {
        presenceChannel = supabaseClient.channel('online-users', {
            config: { presence: { key: 'user' } }
        });

        presenceChannel
            .on('presence', { event: 'sync' }, () => {
                const state = presenceChannel.presenceState();
                renderOnlineUsers(state);
            })
            .subscribe(async (status) => {
                if (status === 'SUBSCRIBED') {
                    updatePresence();
                }
            });
    }

    function updatePresence() {
        const senderInput = document.getElementById('senderId');
        // Se l'utente non ha ancora inserito un ID, lo tracciamo come "UNKNOWN_TERMINAL"
        const currentUserId = senderInput.value.trim().toUpperCase() || "UNKNOWN_TERMINAL";
        
        if (presenceChannel) {
            presenceChannel.track({
                username: currentUserId,
                online_at: new Date().toISOString()
            });
        }
    }

    function renderOnlineUsers(state) {
        const usersListDiv = document.getElementById('usersList');
        usersListDiv.innerHTML = '';
        
        const uniqueUsernames = new Set();

        // Estrae i nomi degli utenti attivi dal dizionario di presenza di Supabase
        Object.values(state).forEach(presencePresences => {
            presencePresences.forEach(p => {
                if(p.username && p.username !== "UNKNOWN_TERMINAL") {
                    uniqueUsernames.add(p.username);
                }
            });
        });

        // Genera i badge grafici LCARS per gli utenti connessi
        uniqueUsernames.forEach(username => {
            const badge = document.createElement('div');
            badge.className = 'user-badge';
            badge.innerText = `• ${username}`;
            usersListDiv.appendChild(badge);
        });
    }

    // --- CHAT CORE FUNCTIONS ---

    async function loadGlobalChat() {
        const { data, error } = await supabaseClient
            .from('transmissions')
            .select('*')
            .eq('post_id', GLOBAL_POST_ID)
            .order('id', { ascending: true });
        
        if (error) {
            console.error("Subspace interference:", error);
            return;
        }

        const chatMatrix = document.getElementById('chatMatrix');
        chatMatrix.innerHTML = '';

        if (data) {
            data.forEach(item => appendMessage(item, false));
            scrollToBottom();
        }
    }

    function appendMessage(item, triggerScroll = true) {
        const chatMatrix = document.getElementById('chatMatrix');
        if (document.querySelector(`[data-id="${item.id}"]`)) return;

        const msgNode = document.createElement('div');
        msgNode.className = 'msg-item';
        msgNode.setAttribute('data-id', item.id);
        msgNode.innerHTML = `
            <div class="msg-content">
                <div class="msg-meta">
                    <span>SENDER: ${item.sender}</span>
                    <span>STARDATE: ${item.stardate}</span>
                </div>
                <div class="msg-text">${item.message}</div>
            </div>
        `; // <--- Rimosso completamente il bottone DELETE
        chatMatrix.appendChild(msgNode);
        
        if (triggerScroll) scrollToBottom();
    }

    async function transmitGlobalMessage(event, form) {
        event.preventDefault();
        
        const senderInput = document.getElementById('senderId');
        const authInput = document.getElementById('authCode');
        const textInput = document.getElementById('msgText');
        
        const exactStardate = getFutureStardate();
        const senderValue = senderInput.value.trim().toUpperCase();
        const authValue = authInput.value.trim().toUpperCase();

        if (senderValue === ADMIN_SENDER && authValue !== ADMIN_KEY) {
            alert("ACCESS DENIED: INVALID STARFLEET COMMAND CREDENTIALS.");
            return;
        }

        // --- VERIFICA ID UNIVOCO ---
        // Controlla se l'ID esiste già nel database globale
        const { data: existingUser, error: checkError } = await supabaseClient
            .from('transmissions')
            .select('auth_code')
            .eq('sender', senderValue)
            .limit(1);

        if (!checkError && existingUser && existingUser.length > 0) {
            // Se l'ID esiste, verifichiamo se il codice inserito corrisponde a quello memorizzato
            if (existingUser[0].auth_code !== authValue) {
                alert(`TRANSMISSION DENIED: SENDER ID "${senderValue}" IS RESERVED. INVALID AUTH CODE.`);
                return;
            }
        }

        // Se il controllo passa, inserisce il messaggio
        const { error } = await supabaseClient.from('transmissions').insert([
            { 
                sender: senderValue, 
                auth_code: authValue, 
                message: textInput.value, 
                stardate: exactStardate,
                post_id: GLOBAL_POST_ID
            }
        ]);

        if (error) {
            alert("TRANSMISSION FAILED: INTERFERENCE DETECTED OR UNEXPECTED DATABASE ERROR.");
            console.error(error);
            return;
        }

        textInput.value = '';
        updatePresence(); // Sincronizza il nome definitivo nella colonna online
    }

    function scrollToBottom() {
        const chatMatrix = document.getElementById('chatMatrix');
        chatMatrix.scrollTop = chatMatrix.scrollHeight;
    }
</script>

</body>
